<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 纯粹极简几何铅笔：严格白蓝配色，扁平无阴影，靠留白切缝与明暗蓝白反差建立高对比 -->
  <g id="Minimalist_WhiteBlue_Pencil" transform="translate(576, 504) rotate(42)">

    <!-- 1. 笔尖（高对比纯白三角，与深蓝笔杆和黑色波浪线形成干脆的几何切分） -->
    <path d="M 0 0 L -34 -72 L 34 -72 Z" fill="#FFFFFF"/>

    <!-- 2. 笔芯（深海军蓝/炭黑小三角，稳住笔尖视觉锚点） -->
    <path d="M 0 0 L -14 -30 L 14 -30 Z" fill="#0F172A"/>

    <!-- 3. 笔杆主体（高饱和深科技蓝，与浅蓝白板画布拉开强烈明度差，中间留 10px 负空间切缝） -->
    <rect x="-34" y="-254" width="68" height="172" rx="6" fill="#0055FF"/>

    <!-- 4. 笔帽（纯粹亮天蓝或纯白，顶部大圆角，与笔杆保持 10px 负空间切缝） -->
    <path d="M -34 -264 L -34 -302 C -34 -321, -19 -336, 0 -336 C 19 -336, 34 -321, 34 -302 L 34 -264 Z" fill="#38BDF8"/>

  </g>
</svg>
